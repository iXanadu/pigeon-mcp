[project]
name = "pigeon-mcp"
version = "0.1.0"
description = "Pigeon — self-hosted Gmail MCP for GrokBot (stdio + Streamable HTTP)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]

[project.scripts]
pigeon-mcp = "pigeon_mcp.server:main"
pigeon-mcp-http = "pigeon_mcp.http_server:main"
pigeon-doctor = "pigeon_mcp.doctor:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
